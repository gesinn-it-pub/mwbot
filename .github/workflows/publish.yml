## https://github.com/gesinn-it-pub/mwbot

name: Publish to npm

on:
  release:
    types:
      - published

jobs:

  publish:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for npm provenance (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (Trusted Publishing requires npm >= 11.5.1)
        run: |
          corepack enable npm
          corepack prepare npm@^11 --activate

      - name: Build and run full test suite in Docker
        run: make ci

      - name: Ensure containers are stopped
        run: make down
        if: always()

      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN
          version=$(node -p "require('./package.json').version")
          current_latest=$(npm view mwbot dist-tags.latest 2>/dev/null || echo "0.0.0")
          # This is the 2.x maintenance branch. Once a newer major is "latest", a 2.x release must not move it.
          if [[ "$version" == *-* ]]; then
            tag=next-2
          elif [[ "${current_latest%%.*}" -gt 2 ]]; then
            tag=latest-2
          else
            tag=latest
          fi
          echo "Publishing $version with tag $tag (current latest: $current_latest)"
          npm publish --access public --tag "$tag"
