name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:

  ci:
    name: "MW ${{ matrix.mw }} / PHP ${{ matrix.php }} / Node ${{ matrix.node }}"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - { mw: '1.39', php: '8.1', node: '22' }
          - { mw: '1.43', php: '8.2', node: '22', coverage: true }
          - { mw: '1.46', php: '8.5', node: '24' }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run CI
        run: MW_VERSION=${{ matrix.mw }} PHP_VERSION=${{ matrix.php }} NODE_VERSION=${{ matrix.node }} make ci

      - name: Ensure down
        run: make down
        if: always()

      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage/clover.xml
        if: matrix.coverage == true
